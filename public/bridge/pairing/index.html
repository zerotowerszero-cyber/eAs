<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>bridge pairing</title>
    <link rel="icon" href="/bridge/pairing/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/bridge/pairing/styles.css" />
  </head>
  <body>
    <div class="top">
      <img class="mark" src="/bridge/pairing/logo.svg" alt="" />
      <span class="wordmark">bridge</span>
    </div>
    <h1 id="headline">Pairing code</h1>
    <p class="lede" id="lede">
      Start bridge Agent on the Windows PC. This page shows the code your Mac needs.
    </p>
    <section class="pin-card">
      <div class="label">Pairing code</div>
      <div class="pin" id="pin">------</div>
      <div class="meta">
        <div class="row"><span>Name</span><span id="name">—</span></div>
        <div class="row"><span>On your Mac</span><span>Open bridge, then Add</span></div>
      </div>
    </section>
    <p class="foot">
      Command-Shift-Option-0 returns you to the Mac. Traffic stays on your Wi-Fi after pairing.
    </p>
    <script src="/bridge/pairing/app.js"></script>
  </body>
</html>
